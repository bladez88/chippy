services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: chippy
      POSTGRES_PASSWORD: chippy
      POSTGRES_DB: chippy
    ports:
      - "5432:5432"
    volumes:
      - chippy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chippy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  chippy_postgres:
